syntax = "proto3";

package gridx.grid.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/p2p-energy-trading-platform/go-sdk/gen/gridx/grid/v1;gridv1";

message GridTransferRule {
  reserved 1, 2;
  reserved "seller_grid_zone", "buyer_grid_zone";
  bool allowed = 3;
  int64 grid_fee_per_kwh = 4;
  uint32 version = 5;
  google.protobuf.Timestamp updated_at = 6;
  uint32 seller_grid_zone_id = 7;
  uint32 buyer_grid_zone_id = 8;
}
