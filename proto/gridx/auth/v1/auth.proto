syntax = "proto3";

package gridx.auth.v1;

option go_package = "github.com/p2p-energy-trading-platform/go-sdk/gen/gridx/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);

  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  rpc VerifyEmailChange(VerifyEmailChangeRequest) returns (VerifyEmailChangeResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendOtp(ResendOtpRequest) returns (ResendOtpResponse);
  rpc SubmitKyc(SubmitKycRequest) returns (SubmitKycResponse);

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  string status = 3;
  string created_at = 4;
  string name = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string email = 2;
  string access_token = 3;
  string refresh_token = 4;
  int64 expires_in = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message LogoutAllRequest {}

message LogoutAllResponse {
  bool success = 1;
}

// Account management

message UserProfile {
  string user_id = 1;
  string email = 2;

  reserved 3, 4;
  reserved "first_name", "last_name";

  string status = 5;
  string created_at = 6;
  string name = 7;
}

message GetProfileRequest {}

message GetProfileResponse {
  UserProfile profile = 1;
}

message UpdateProfileRequest {
  reserved 1, 2;
  reserved "first_name", "last_name";

  string name = 3;
}

message UpdateProfileResponse {
  UserProfile profile = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  bool success = 1;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  bool success = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
}

message RequestEmailChangeRequest {
  string new_email = 1;
}

message RequestEmailChangeResponse {
  bool success = 1;
}

message VerifyEmailChangeRequest {
  string token = 1;
}

message VerifyEmailChangeResponse {
  UserProfile profile = 1;
}

message VerifyEmailRequest {
  string email = 1;
  string otp = 2;
}

message VerifyEmailResponse {
  bool success = 1;
  string message = 2;
}

message ResendOtpRequest {
  string email = 1;
}

message ResendOtpResponse {
  bool success = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string status = 3;
  string role = 4;
  string name = 5;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission_name = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message SubmitKycRequest {
  string full_name = 1;
  string date_of_birth = 2;
  string dubai_id = 3;
  string document_path = 4;
}

message SubmitKycResponse {
  KycSubmission submission = 1;
}

message KycSubmission {
  string id = 1;
  string user_id = 2;
  string full_name = 3;
  string date_of_birth = 4;
  string dubai_id = 5;
  string document_path = 6;
  string state = 7;
  string rejection_reason = 8;
  string verified_at = 9;
  string created_at = 10;
  string updated_at = 11;
}
